name: vocalearn
description: "VocaLearn - Adaptive Learning Engine untuk Personalisasi Modul Praktik Mahasiswa Vokasi"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing (role-based)
  go_router: ^14.2.0

  # Networking (hubungkan ke backend AI Adaptive Engine nanti)
  dio: ^5.4.3

  # Visualisasi kompetensi (radar chart, bar chart)
  fl_chart: ^0.68.0

  # Video demonstrasi praktik
  video_player: ^2.9.1
  chewie: ^1.8.3

  # Penyimpanan token/session
  flutter_secure_storage: ^9.2.2

  # UI polish
  google_fonts: ^6.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true